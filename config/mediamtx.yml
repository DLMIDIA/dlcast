###############################################################################
# DLCast Pro v2.0 - Servidor de Transmissão de Vídeo de Alta Performance
# Configuração do núcleo de mídia (MediaMTX v1.20.0+)
#
# Otimizado para transmissões de drones (DJI, Autel, FPV) via Wi-Fi Local e
# Nuvem Global (ngrok / 4G / 5G / Starlink).
#
# Documentação completa: docs/
###############################################################################

###############################################################################
# 1. LOGS & DIAGNÓSTICO
###############################################################################
logLevel: info
logDestinations: [stdout, file]
logFile: ./logs/mediamtx.log

###############################################################################
# 2. BUFFER DE RESILIÊNCIA & TOLERÂNCIA A JITTER (4G / 5G / RÁDIO)
#
# O sinal de drones passa por múltiplos hops: Drone -> OcuSync/Radio ->
# Controle DJI -> Wi-Fi/4G Hotspot -> DLCast.
# Configurações aumentadas para suportar oscilações de conexão sem travamentos.
###############################################################################
readTimeout: 30s
writeTimeout: 30s

# Fila ampliada para 2048 pacotes: absorve rajadas de pacotes de 4G/5G e Wi-Fi congestionado
writeQueueSize: 2048

# Evita fragmentação IP em túneis VPN, 4G e redes móveis
udpMaxPayloadSize: 1452

###############################################################################
# 3. AUTENTICAÇÃO E PERMISSÕES
###############################################################################
authMethod: internal

authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish   # o drone e as câmeras enviam vídeo
      - action: read      # reprodutores (WebRTC, HLS, RTSP)
      - action: playback  # replay e gravações
      - action: api       # painel de controle e monitoramento
      - action: metrics   # métricas de qualidade ao vivo

###############################################################################
# 4. APIS DE CONTROLE, PLAYBACK E MÉTRICAS
###############################################################################
api: yes
apiAddress: :9997
apiAllowOrigins: ["*"]

metrics: yes
metricsAddress: :9998
metricsAllowOrigins: ["*"]

playback: yes
playbackAddress: :9996
playbackAllowOrigins: ["*"]

###############################################################################
# 5. RTMP - ENTRADA PRINCIPAL DE DRONES E CÂMERAS
#
# Porta padrão 1935. Suporta ingestão direta local e via túnel TCP ngrok.
###############################################################################
rtmp: yes
rtmpAddress: :1935
rtmpEncryption: "no"

###############################################################################
# 6. PROTOCOLOS DE SAÍDA (ULTRA-BAIXA LATÊNCIA)
###############################################################################

# --- WebRTC: Latência Sub-segundo (< 300ms) ---------------------------------
# Ideal para pilotagem visual, retorno do diretor e replay instantâneo.
webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigins: ["*"]
webrtcLocalUDPAddress: :8189
webrtcIPsFromInterfaces: yes

# Servidor STUN público do Google para NAT Traversal e conexões remotas via ngrok
webrtcICEServers2:
  - url: stun:stun.l.google.com:19302

# --- HLS: Compatibilidade Máxima (Smart TVs, iPads, Android) ----------------
# Low-Latency HLS com segmentos de 1s para latência reduzida (2-3s).
hls: yes
hlsAddress: :8888
hlsAllowOrigins: ["*"]
hlsVariant: lowLatency
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsSegmentCount: 7
hlsAlwaysRemux: yes

# --- RTSP: Para Integração Profissional (OBS Studio, vMix, VLC, NDI) --------
rtsp: yes
rtspAddress: :8554
rtspTransports: [udp, multicast, tcp]

# --- SRT: Para Links Móveis em Campo (4G / 5G / Starlink) -------------------
srt: yes
srtAddress: :8890

###############################################################################
# 7. PADRÕES PARA STREAMS E GRAVAÇÃO RESILIENTE
###############################################################################
pathDefaults:
  source: publisher
  overridePublisher: yes

  # Gravação de contingência em fMP4 (fragmented MP4)
  # Resistente a quedas repentinas de sinal ou energia
  record: no
  recordPath: ./recordings/%path/%Y-%m-%d_%H-%M-%S-%f
  recordFormat: fmp4
  recordSegmentDuration: 1h
  recordDeleteAfter: 168h

###############################################################################
# 8. ROTAS (STREAMS MULTI-CÂMERA)
###############################################################################
paths:
  # Drone Primário (DJI Air 3, Mavic 3, Mini 4 Pro, Avata 2, Matrice, etc.)
  # Endereço: rtmp://<IP-OU-NGROK>:1935/drone
  drone:

  # Drone Secundário / FPV de Acompanhamento
  # Endereço: rtmp://<IP-OU-NGROK>:1935/drone2
  drone2:

  # Câmera de Solo / Produção (Sony FX30, FX3, Blackmagic, Câmera HDMI)
  # Endereço: rtmp://<IP-OU-NGROK>:1935/camera
  camera:

  # Câmera de Smartphone (Larix Broadcaster iOS/Android)
  # Endereço: rtmp://<IP-OU-NGROK>:1935/celular
  celular:

  # Master do OBS Studio / Switcher
  # Endereço: rtmp://<IP-OU-NGROK>:1935/obs
  obs:

  # Canal de Teste (para validação com barras de cores e tom de 1kHz)
  teste:
    record: no

  # Aceita qualquer outro nome digitado no aplicativo sem rejeitar
  all_others:
